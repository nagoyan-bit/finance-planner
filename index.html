<script>
const TABS=[["home","ホーム"],["inc","収入配分"],["tx","家計簿"],["cal","予定"],["acct","口座"],["debt","借金"],["set","設定"]];
let S=null,tab="home",sel=0,strat="prio",msg="";
const $=s=>document.querySelector(s),N=x=>Number(x)||0,F=n=>Math.round(N(n)).toLocaleString()+"円";
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ym=d=>d.slice(0,7),addM=(m,n)=>{let[y,mo]=m.split("-").map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12)+1;return y+"-"+String(mo).padStart(2,"0")};
const uid=()=>Math.random().toString(36).slice(2,9);
const ST={prio:"ユーザー優先順位",fast:"最速完済(最低返済解放優先)",rate:"利息最小化(高金利順)",count:"借入件数削減(残高少順)"};
const CATS=["食費","交通費","日用品","交際費","娯楽費","保険料","通信費","ギャンブル","その他"],PM={credit:"クレジットカード",cash:"現金",paypay:"PayPay残高払い",paypaycr:"PayPayクレジット"};
function blank(){return{debts:[],family:{bal:0,monthly:0},cash:0,emerg:0,cfg:{living:0,free:0,fam:0,emgTarget:0,emgBy:today().slice(0,7),salTarget:0,gamble:0},cards:[{id:"c1",name:"カード1",close:null,pay:null}],plan:{},inc:[],tx:[],bud:{total:0,credit:0,cash:0,paypay:0,fixed:{credit:0,cash:0,paypay:0}},plans:[],log:[],accts:[],inst:[],conf:{},jobs:[],rec:[],recDone:{}}}
function minFor(d,b){const t=String(d.tiers||"").split(",").map(x=>x.split(":").map(Number)).filter(x=>x[0]>0&&x[1]>=0).sort((a,b)=>a[0]-b[0]);for(const[l,m]of t)if(b<=l)return m;return N(d.min)}
function salCard(){const y="2027",cur=ym(today()),act=S.inc.filter(x=>x.actual&&x.type=="給与"&&x.date.startsWith(y)),by={};act.forEach(x=>{const k=x.job||"未指定";by[k]=(by[k]||0)+N(x.amt)});const a=act.reduce((s,x)=>s+N(x.amt),0),got=new Set(act.map(x=>ym(x.date))),rem=Object.keys(S.plan).filter(m=>m.startsWith(y)&&m>=cur&&!got.has(m)).reduce((s,m)=>s+N(S.plan[m].sal),0),f=a+rem,t=N(S.cfg.salTarget);
return`<div class="c"><h2>年間給与(${y}年)</h2>${bar(f,t)}<div class="m">実績${F(a)} + 今後の計画${F(rem)} = 見込み${F(f)} / 目標${F(t)} 残り枠${F(t-f)} ${f>t?'<span class="w">⚠ 目標超過見込み</span>':""}</div>${Object.entries(by).map(([k,v])=>`<div class="row">${E(k)} ${F(v)}</div>`).join("")}<div class="row"><input id="jn" placeholder="勤務先を追加(TA等)"><button class="s" onclick="if($('#jn').value){S.jobs.push($('#jn').value);save();R()}">追加</button></div><div class="m">親の援助・交通費精算は給与に含めません。扶養の可否は税法上と健康保険上で別制度のため、年収だけでは判断できません。</div></div>`}
let calM=null;
function dueDay(m,c){const[y,mo]=m.split("-").map(Number),dt=new Date(y,mo-1,c.pay||27),w=dt.getDay();if(w==6)dt.setDate(dt.getDate()+2);if(w==0)dt.setDate(dt.getDate()+1);return dt.getMonth()+1==mo?dt.getDate():dt.getDate()}
function V_cal(){const m=calM||ym(today()),[y,mo]=m.split("-").map(Number),first=new Date(y,mo-1,1).getDay(),days=new Date(y,mo,0).getDate(),ev={},add=(d,t)=>{(ev[d]=ev[d]||[]).push(t)};
S.inc.filter(x=>ym(x.date)==m).forEach(x=>add(+x.date.slice(8),`<span style="color:var(--ac)">+${Math.round(N(x.amt)/100)/10}k${x.actual?"":"(予)"}</span>`));
const sp={},du={};S.tx.filter(x=>ym(x.date)==m).forEach(x=>{const d=+x.date.slice(8);sp[d]=(sp[d]||0)+N(x.amt)});for(const d in sp)add(d,`−${Math.round(sp[d]/100)/10}k`);
S.tx.filter(x=>x.pm=="credit"||x.pm=="paypaycr").forEach(t=>{const bd=billing(t.date,S.cards.find(c=>c.id==t.card)||S.cards[0]);if(ym(bd)==m){const d=+bd.slice(8);du[d]=(du[d]||0)+N(t.amt)}});
S.inst.forEach(i=>instRows(i).forEach(([mm,a])=>{if(mm==m){const d=dueDay(m,S.cards.find(c=>c.id==i.card)||S.cards[0]);du[d]=(du[d]||0)+a}}));for(const d in du)add(d,`<span class="w">請求${Math.round(du[d]/100)/10}k</span>`);
let cells="";for(let i=0;i<first;i++)cells+="<div></div>";for(let d=1;d<=days;d++)cells+=`<div style="min-height:54px;border:1px solid var(--bd);border-radius:4px;font-size:10px;padding:2px;overflow:hidden"><b>${d}</b>${(ev[d]||[]).map(t=>"<div>"+t+"</div>").join("")}</div>`;
return`<div class="c"><div class="row"><button class="s" onclick="calM=addM('${m}',-1);R()">←</button><b>${y}年${mo}月</b><button class="s" onclick="calM=addM('${m}',1);R()">→</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${["日","月","火","水","木","金","土"].map(x=>`<div class="k">${x}</div>`).join("")}${cells}</div><div class="m">緑=収入(予)=予定、黒=支出合計、赤=カード請求日(土日は翌月曜)</div></div>`}
let xm=0;
function whatIf(r){const w=sim(strat,{xm}),delta=/^\d{4}-\d{2}$/.test(r.end)&&/^\d{4}-\d{2}$/.test(w.end)?Math.max(0,(Number(r.end.slice(0,4))-Number(w.end.slice(0,4)))*12+Number(r.end.slice(5))-Number(w.end.slice(5))):null;return`<div class="c"><h2>もし毎月追加で返済できたら</h2><div class="row"><input type="number" value="${xm}" onchange="xm=N(this.value);R()">円/月</div><div class="m">総支払利息 ${F(r.int)} → ${F(w.int)}(${F(r.int-w.int)}削減)/完済 ${r.end} → ${w.end}${delta===null?"":`（${delta}か月短縮）`}</div></div>`}
function addRec(){const a=N($("#ra2").value),day=N($("#rd2").value)||1,p=paymentValue($("#rp").value);if(a<=0){alert("金額を入力してください");return}if(!p){alert("使うカードまたは支払い方法を選択してください");return}if(!Number.isInteger(day)||day<1||day>31){alert("支払日は1〜31日で入力してください");return}S.rec.push({id:uid(),name:$("#rn").value||"固定費",amt:a,day,cat:$("#rc").value,pm:p.pm,card:p.card});save();R()}
function editRecPayment(n,v){const r=S.rec[n],p=paymentValue(v,r);if(!r||!p){R();return}Object.assign(r,p);save();R()}
function postFixed(r,m){const k=r.id+m;if(S.recDone[k])return false;S.tx.push({id:uid(),date:dayDate(m,r.day),amt:r.amt,cat:r.cat,pm:r.pm,card:r.card,acct:chooseAccount(r.pm)?.id||"",memo:r.name,recKey:k});pAdj(r.pm,-r.amt,S.tx.at(-1).acct);S.recDone[k]=1;return true}
function confirmFixed(n){const r=S.rec[n];if(!r||S.recDone[r.id+ym(today())])return;if(dayDate(ym(today()),r.day)>today()&&!confirm("予定日より前ですが、支出として確定しますか？"))return;if(postFixed(r,ym(today()))){logA("固定費確定 "+r.name);save();R()}}
function applyRec(){const t=today(),m=ym(t);let n=0;S.rec.forEach(r=>{if(dayDate(m,r.day)<=t&&postFixed(r,m))n++});if(n){logA("固定費反映 "+n+"件");save()}R()}
function backCalc(st){const p=S.plan[addM(ym(today()),9)];if(!p)return null;const s8=N(p.sal)+N(p.parent)+N(p.other)-N(S.cfg.living)-N(S.cfg.free)-N(p.fam)-N(p.card)-N(p.emg);for(let x=0;x<=100000;x+=1000){const r=sim(st,{xm:x});if(r.min0<=s8&&!r.warn.length)return{x,min0:r.min0,s8}}return{x:null,min0:sim(st).min0,s8}}
function backCard(){const b=backCalc(strat);if(!b)return"";return`<h3>約9か月後以降への備え(逆算)</h3><div class="m">8月の返済可能額 ${F(b.s8)} / 現計画での最低返済 ${F(b.min0)}。${b.x==null?"毎月10万円の追加返済でも足りません。計画の見直しが必要です。":b.x==0?"現計画で約9か月後以降の最低返済を賄えます。":`平均して毎月${F(b.x)}の追加返済(臨時収入を含む)を前半に確保すると、約9か月後以降の最低返済を賄えます。`}</div>`}
function famCard(){const f=S.family,m=Math.max(1,N(S.cfg.fam)),n=Math.ceil(N(f.bal)/m);return`<div class="c"><h2>家族への借金</h2><div class="m">残高${F(f.bal)} / 毎月${F(m)}で完済予定 ${f.bal>0?addM(ym(today()),n):"完済"}(${n}か月)</div>${bar(N(f.bal0||f.bal)-N(f.bal),N(f.bal0||f.bal))}<div class="row"><input type="number" id="fa" placeholder="返済額"><button onclick="famPay()">返済実績を登録</button></div></div>`}
function famPay(){const f=S.family,a=N($("#fa").value);if(!a)return;if(!f.bal0)f.bal0=f.bal;f.bal=Math.max(0,f.bal-a);adj(-a);logA("家族へ返済 "+a);save();R()}
function miles(){const d=S.debts.filter(d=>d.bal<=0);return d.length?`<div class="m">🎉 完済: ${d.map(x=>E(x.name)).join("、")} / 最低返済 −${F(d.reduce((s,x)=>s+N(x.min),0))}/月</div>`:""}
function review(){const m=ym(today()),pm=addM(m,-1),by=mm=>{const o={};S.tx.filter(x=>ym(x.date)==mm).forEach(x=>o[x.cat]=(o[x.cat]||0)+N(x.amt));return o},a=by(m),b=by(pm),tot=Object.values(a).reduce((s,v)=>s+v,0),up=Object.keys(a).map(k=>[k,a[k]-(b[k]||0)]).sort((x,y)=>y[1]-x[1])[0],tb=N(S.bud.total);
return`<div class="c"><h2>月次の振り返り</h2><div class="m">今月の支出 ${F(tot)} / 総予算 ${F(tb)}(${tb?Math.round(tot/tb*100):0}%) ${tot>tb?'<span class="w">超過</span>':""}</div>${["credit","cash","paypay"].map(k=>{const x=budget(k);return x.b?`<div class="m">${PM[k]}: ${F(x.used)}/${F(x.b)}${x.over?' <span class="w">超過'+F(x.over)+"</span>":""}</div>`:""}).join("")}${up&&up[1]>0?`<div class="m">前月より増えた項目: ${E(up[0])}(+${F(up[1])})</div>`:""}</div>`}
function ledger(){const a=S.inc.filter(x=>x.actual);if(!a.length)return"";return`<div class="c"><h2>入金ごとの使い道</h2>${a.map(x=>{const ps=S.plans.filter(p=>p.inc==x.id),it=ps.flatMap(p=>p.items),st=!ps.length?'<span class="w">未承認</span>':it.every(i=>i.done)?"実績登録済み":it.filter(i=>i.done).length+"/"+it.length+" 実績登録";return`<div class="row">${x.date.slice(5)} ${F(x.amt)} ${E(x.type)} — ${st}</div>`}).join("")}</div>`}
async function csvOut(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',rows=[["日付","金額","カテゴリー","支払い方法","メモ"],...S.tx.map(x=>[x.date,x.amt,x.cat,PM[x.pm],x.memo]),[],["入金日","金額","種類","区分"],...S.inc.map(x=>[x.date,x.amt,x.type,x.actual?"実績":"予定"])];try{browserSave("kakeibo.csv","\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n"))}catch(e){msg="保存をキャンセルしました"}R()}
function gcap(){return S.cfg.gamble==null?20000:N(S.cfg.gamble)}
function gUsed(){return S.tx.filter(x=>x.cat=="ギャンブル"&&ym(x.date)==ym(today())).reduce((s,x)=>s+N(x.amt),0)}
function notes(){const n=[],last=S.lastBk,days=last?Math.floor((Date.now()-new Date(last))/864e5):null;if(S.debts.length&&(last==null||days>=30))n.push("バックアップが"+(last?days+"日前です":"未実施です")+"(設定→JSON保存)");if(S.debts.length&&S.debts.every(d=>N(d.rate)==18))n.push("金利がすべて仮の18%です。実際の金利を入れると利息最小化の提案が変わります");if(S.cards.some(c=>!c.close||!c.pay))n.push("カードの締め日・支払日が未入力です(家計簿→カード設定)");const g=gcap(),u=gUsed();

function dayDate(m,d){return m+"-"+String(Math.min(dim(m),Math.max(1,Math.floor(N(d)||1)))).padStart(2,"0")}

function cashflow90(){const t=today(),end=plusDays(t,90),events=paymentEvents(end).map(e=>({...e,amt:-e.amt,date:e.date<t?t:e.date})),seen=new Set();for(const x of S.inc.filter(x=>!x.actual&&x.date>=t&&x.date<=end)){events.push({date:x.date,amt:N(x.amt),label:x.type});if(x.type==="給与")seen.add((x.job||"")+"|"+ym(x.date))}for(const rule of S.salaryRules)for(let i=0;i<4;i++){const m=addM(ym(t),i),date=dayDate(m,rule.day);if(date>=t&&date<=end&&!seen.has(rule.name+"|"+m)&&!S.inc.some(x=>x.actual&&x.type==="給与"&&x.job===rule.name&&ym(x.date)===m)){events.push({date,amt:N(rule.amt),label:rule.name});seen.add(rule.name+"|"+m)}}for(let i=0;i<4;i++){const m=addM(ym(t),i),date=dayDate(m,dim(m));if(date>=t&&date<=end){const base=N(S.cfg.living)+N(S.cfg.free),used=S.tx.filter(x=>ym(x.date)===m).reduce((a,x)=>a+N(x.amt),0),fixed=S.rec.filter(x=>x.pm==="cash"||x.pm==="paypay").filter(x=>!S.recDone[x.id+m]).reduce((a,x)=>a+N(x.amt),0);events.push({date,amt:-Math.max(0,base-used-fixed)-N(S.plan[m]?.fam)-N(S.plan[m]?.emg),label:"生活費等の残額"})}}let bal=N(S.cash),points=[],first=null;for(let i=0;i<=90;i++){const date=plusDays(t,i);bal+=events.filter(e=>e.date===date).reduce((a,e)=>a+e.amt,0);points.push([date,bal]);if(bal<0&&!first)first=date}return{points,first,end:bal}}

return transferPanel()+accountForecastPanel()+accountLinks()+reconcilePanel()+`<div class="c"><h2>口座</h2><div class="sc"><table><tr><th>名前</th><th>用途</th><th>残高</th><th>目標</th><th>区分</th><th>達成</th></tr>${o}</table></div><div class="m">手元資金 ${F(S.cash)} / 緊急貯金 ${F(S.emerg)}(口座残高の合計から自動計算)</div><div class="row"><input id="an" placeholder="口座名"><button class="s" onclick="S.accts.push({id:uid(),name:$('#an').value||'新口座',bal:0});save();R()">追加</button></div></div>
<div class="c"><h2>口座間の振替</h2><div class="row"><select id="xf">${opt}</select>→<select id="xt">${opt}</select><input type="number" id="xa" placeholder="金額"><button onclick="xfer()">振替</button></div><div class="m">振替は収入・支出に計上されません。緊急貯金口座からの振替は警告します。</div></div>`}
function accInit(){const L=[["未割当(手元資金)","振替前の残高",S.cash],["三菱UFJ銀行","給与受取"],["イオン銀行","生活費"],["PayPay銀行","自由費"],["みんなの銀行","緊急貯金",0,1],["ゆうちょ銀行","返済資金"],["現金","現金"],["PayPay残高","PayPay"]];S.accts=L.map(([n,p,b,e])=>({id:uid(),name:n,purpose:p,bal:b||0,emg:e?"1":""}));if(S.emerg>0)S.accts[4].bal=S.emerg;logA("口座管理開始");sync();save();R()}
function xfer(){const f=S.accts.find(a=>a.id==$("#xf").value),t=S.accts.find(a=>a.id==$("#xt").value),a=N($("#xa").value);if(!f||!t||f==t||a<=0)return;if(a>N(f.bal)){alert("振替元の残高が不足しています");return}if(f.emg&&!confirm("緊急貯金口座から取り崩します。よろしいですか?"))return;f.bal-=a;t.bal=N(t.bal)+a;sync();logA("振替 "+f.name+"→"+t.name+" "+a);save();R()}
function addTx(){const a=N($("#ta").value);if(a<=0){alert("支出額を入力してください");return}const p=paymentValue($("#tp").value);if(!p){alert("使ったカードまたは支払い方法を選択してください");return}if($("#tc").value=="ギャンブル"&&gUsed()+a>gcap()&&!confirm("月の上限("+F(gcap())+")を超えます。登録しますか?"))return;S.tx.push({id:uid(),date:$("#td").value,amt:a,cat:$("#tc").value,pm:p.pm,card:p.card,memo:$("#tm").value});pAdj(p.pm,-a,S.tx.at(-1).acct);S.cfg.lastPay=$("#tp").value;logA("支出 "+a);save();R()}
function delTx(id){if(!confirm("この支出記録を削除しますか？"))return;const x=S.tx.find(t=>t.id==id);if(x){pAdj(x.pm,N(x.amt),x.acct);if(x.recKey)delete S.recDone[x.recKey]}S.tx=S.tx.filter(t=>t.id!=id);logA("支出削除");save();R()}
function approve(){const i=S.inc[sel];if(!i||!i.actual||S.plans.some(p=>p.inc===i.id)){alert("登録済みまたは未入金です");return}const a=alloc(N(i.amt),strat);S.plans.push({id:uid(),inc:i.id,items:a.items.map(x=>({...x,done:false}))});logA("配分承認 "+ST[strat]);save();R()}
function doneItem(p,x){const it=S.plans[p].items[x];if(it.done)return;if(it.type=="rep"){const d=S.debts.find(d=>d.id==it.debtId);if(!d)return;const v=prompt("実際の支払額に含まれる利息(円)を入力",accrued(d)??"");if(v===null||v.trim()===""||!Number.isFinite(Number(v)))return;if(!recordPayment(d,it.amt,Number(v)))return}else if(it.type=="emg"){if(it.amt>S.cash){alert("手元資金不足");return}const src=chooseAccount("salary"),dst=purposeAccount("emergency");if(S.accts.length&&(!src||!dst||N(src.bal)<it.amt)){alert("給与口座・緊急貯金口座と残高を確認してください");return}adj(-it.amt,src?.id);adj(it.amt,dst?.id,true)}it.done=true;logA("実績登録 "+it.label+" "+it.amt);save();R()}

function recordPayment(d,a,ie){if(!d||a<=0||a>S.cash||ie<0||ie>a||a-ie>d.bal){alert("支払額・利息・手元資金を確認してください");return false}const ac=chooseAccount("repay",d.acct);if(ac&&N(ac.bal)<a){alert("返済口座の残高不足："+ac.name);return false}const accruedNow=accrued(d);d.bal=Math.max(0,d.bal-(a-ie));d.paidInterest=N(d.paidInterest)+ie;d.carryInterest=Math.max(0,(accruedNow??ie)-ie);d.lastDate=today();const key=paidKey(ym(today()),d.id);S.debtPaid[key]=N(S.debtPaid[key])+a;S.paylog.push({date:today(),debt:d.id,principal:a-ie,interest:ie,amount:a,acct:ac?.id||""});adj(-a,ac?.id);logA("返済実績 "+d.name+" 支払"+a+"(元金"+(a-ie)+"/利息"+ie+")");return true}
function repay(){const d=S.debts.find(d=>d.id==$("#rd").value),a=N($("#ra").value);if(!d||!a)return;const ie=$("#ri").value===""?accrued(d):N($("#ri").value);if(ie==null){alert("利息計算開始日または実際の利息を入力してください");return}if(recordPayment(d,a,ie)){save();R()}}

function mv(i,d){const j=i+d;if(j<0||j>=S.debts.length)return;[S.debts[i],S.debts[j]]=[S.debts[j],S.debts[i]];save();R()}
function browserSave(name,data){const u=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function bk(){try{browserSave("finance-planner-backup.json",JSON.stringify(S));S.lastBk=new Date().toISOString();save()}catch(e){msg="バックアップ保存に失敗しました"}R()}
function rs(el){const f=el.files&&el.files[0];if(!f)return;if(!confirm("現在のデータをバックアップの内容で置き換えます。よろしいですか？"))return;f.text().then(t=>{const d=JSON.parse(t);if(!d||typeof d!=="object"||!Array.isArray(d.debts))throw Error("バックアップ形式が違います");load(t);logA("バックアップを復元");save();R()}).catch(e=>{alert("復元できませんでした: "+e.message)})}
document.addEventListener("change",e=>{const k=e.target.dataset?.k;if(!k)return;const p=k.split("."),v=e.target.type=="number"?(e.target.value===""?null:N(e.target.value)):e.target.value;let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];if(e.target.type==="number"&&v!==null&&v<0){alert("0以上の数値を入力してください");R();return}o[p[p.length-1]]=v;sync();logA("編集 "+k);save();const open=[...document.querySelectorAll(".debtcard details")].map(d=>d.open);R();document.querySelectorAll(".debtcard details").forEach((d,i)=>d.open=!!open[i])});
function R(){applyTheme();const icons={home:"⌂",inc:"＋",tx:"¥",cal:"▦",acct:"▤",debt:"↘",set:"⚙"};$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?"on":""}" aria-current="${k==tab?"page":"false"}" onclick="go(\'${k}\')"><span class="ni" aria-hidden="true">${icons[k]}</span>${l}</button>`).join("");const V={home:V_home,inc:V_inc,tx:V_tx,cal:V_cal,acct:V_acct,debt:V_debt,set:V_set}[tab];$("#app").innerHTML=`<header class="pagehead"><h1>${TABS.find(t=>t[0]===tab)[1]}</h1><small>${today().replaceAll("-","/")} · v3.3</small></header>`+(undoRaw?`<div class="undo"><span class="m">直前の変更を取り消せます</span><button class="s" onclick="undoLast()">↶ 元に戻す</button></div>`:"")+(!S.debts.length&&tab==="home"?`<div class="c"><b>最初の設定</b><p class="m">JSONから復元するか、借入先と予算を登録してください。</p><button onclick="go(\'set\')">データを復元・設定</button> <button class="s" onclick="go(\'debt\')">借入先を登録</button></div>`:"")+V();if(tab==="tx")restoreLastPay()}
(()=>{let raw="{}";try{raw=localStorage.getItem("dp")||"{}"}catch(e){}load(raw);if(S.salaryRules.length)generateSalary(true);R();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{})})();
setInterval(()=>{if(S)R()},3600000);
</script></body></html>
