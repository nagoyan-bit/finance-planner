function parseCSV(s){s=s.replace(/^\uFEFF/,"");let rows=[],row=[],v="",quoted=false;const sep=s.split(/\r?\n/)[0].includes("\t")?"\t":",";for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(!quoted&&c===sep){row.push(v);v=""}else if(!quoted&&(c==="\r"||c==="\n")){if(c==="\r"&&s[i+1]==="\n")i++;row.push(v);rows.push(row);row=[];v=""}else v+=c}if(quoted)throw Error("引用符が閉じていません");if(v||row.length){row.push(v);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

function csvRows(s){const rows=parseCSV(s),norm=x=>x.trim().toLowerCase().replace(/[\s　（）()]/g,""),aliases=[["日付","利用日","ご利用日","取引日","date","利用年月日"],["金額","利用金額","ご利用金額","支出金額","amount","利用額","金額円"],["メモ","利用店名","ご利用店名","店名","摘要","内容","description","merchant","利用先"],["カテゴリー","カテゴリ","category"]];const head=rows.findIndex(r=>aliases[0].some(x=>r.map(norm).includes(x))&&aliases[1].some(x=>r.map(norm).includes(x)));if(head<0)throw Error("日付・金額の列を認識できません。テンプレートの見出しを使用してください。");const cols=aliases.map(a=>rows[head].findIndex(x=>a.includes(norm(x))));return rows.slice(head+1).map((r,i)=>{const date=csvDate(r[cols[0]]),amt=csvAmount(r[cols[1]]),memo=String(r[cols[2]]||"").trim(),cat=CATS.includes(r[cols[3]])?r[cols[3]]:"その他";return{date,amt,memo,cat,line:head+i+2,valid:!!date&&!!amt,skip:false}})}

function validateBackup(d){const errors=[];if(!d||typeof d!=="object"||Array.isArray(d))return["JSONの最上位がオブジェクトではありません"];if(!Array.isArray(d.debts))errors.push("借入データがありません");for(const k of ["debts","inc","tx","cards","accts","rec","inst","plans","log","jobs","favs","salaryRules","paylog","rewardBalances","rewardHistory"]){if(d[k]!==undefined&&!Array.isArray(d[k]))errors.push(k+" の形式が不正です")}for(const k of ["cfg","plan","bud","family","conf","recDone","billPaid","billConf","debtPaid","monthClosed"]){if(d[k]!==undefined&&(!d[k]||typeof d[k]!=="object"||Array.isArray(d[k])))errors.push(k+" の形式が不正です")}for(const k of ["debts","inc","tx","cards","accts","rec","inst"]){if(!Array.isArray(d[k]))continue;const ids=new Set();for(const x of d[k]){if(!x||typeof x!=="object"||typeof x.id!=="string"||!x.id||ids.has(x.id)){errors.push(k+" に不正または重複IDがあります");break}ids.add(x.id);if((k==="tx"||k==="inc")&&(!csvDate(x.date)||!Number.isFinite(Number(x.amt))||Number(x.amt)<=0)){errors.push(k+" に不正な日付・金額があります");break}if((k==="debts"||k==="accts")&&(!Number.isFinite(Number(x.bal))||(k==="debts"&&Number(x.bal)<0))){errors.push(k+" に不正残高があります");break}}}return errors}
function inspectData(){const warnings=[],add=s=>warnings.push(s);for(const a of S.accts)if(N(a.bal)<0)add(a.name+" の残高がマイナスです");for(const c of S.cards){if(!c.close||!c.pay)add(c.name+" の締め日・支払日未設定");if(c.acct&&!S.accts.some(a=>a.id===c.acct&&!a.emg))add(c.name+" の引落口座を確認")}for(const d of S.debts){if(N(d.bal)>0&&!d.day)add(d.name+" の返済日未設定");if(d.acct&&!S.accts.some(a=>a.id===d.acct&&!a.emg))add(d.name+" の返済口座を確認")}for(const x of S.tx)if((x.pm==="credit"||x.pm==="paypaycr")&&!S.cards.some(c=>c.id===x.card))add("カード未紐づけの支出："+x.date+" "+F(x.amt));if(S.accts.length){const cash=S.accts.filter(a=>!a.emg).reduce((n,a)=>n+N(a.bal),0),emg=S.accts.filter(a=>a.emg).reduce((n,a)=>n+N(a.bal),0);if(Math.abs(cash-S.cash)>0.01||Math.abs(emg-S.emerg)>0.01)add("口座合計と総残高が一致しません")}return warnings}

function recordedCardLiability(asOf=today()){const months=new Map(),add=(m,id,amount)=>{if(!/^\d{4}-\d{2}$/.test(m))return;const key=paidKey(m,String(id)),row=months.get(m)||new Map();row.set(key,(row.get(key)||0)+Math.max(0,N(amount)));months.set(m,row)};let unassigned=0;for(const t of S.tx){if(t.date>asOf||!["credit","paypaycr"].includes(t.pm))continue;const c=S.cards.find(c=>String(c.id)===String(t.card))||S.cards[0];if(c)add(billingMonth(t.date,c),c.id,t.amt);else unassigned+=Math.max(0,N(t.amt))}for(const i of S.inst)for(const [m,a] of instRows(i))add(m,i.card||S.cards[0]?.id||"",a);for(const k of Object.keys(S.billConf)){const m=k.slice(0,7);if(!/^\d{4}-\d{2}$/.test(m))continue;if(!months.has(m))months.set(m,new Map());if(!months.get(m).has(k))months.get(m).set(k,0)}for(const m of Object.keys(S.conf))if(/^\d{4}-\d{2}$/.test(m)&&!months.has(m))months.set(m,new Map());const rows=[...months].map(([m,items])=>{let due=0,paid=0;for(const [k,amt] of items){const p=Math.max(0,N(S.billPaid[k]?.amount));due+=Math.max(p,Math.max(0,N(S.billConf[k]??amt)));paid+=p}return {m,unpaid:Math.max(0,Math.max(due,N(S.conf[m]))-paid)}}).sort((a,b)=>a.m.localeCompare(b.m));return {total:unassigned+rows.reduce((n,r)=>n+r.unpaid,0),rows,unassigned}}
function assetSummary(){const debt=S.debts.reduce((n,d)=>n+N(d.bal),0)+N(S.family.bal),assets=N(S.cash)+N(S.emerg),card=recordedCardLiability(),interest=S.debts.reduce((n,d)=>n+Math.max(0,N(accrued(d)??d.carryInterest)),0),claims=claimTotals(),liabilities=debt+card.total+interest;return {debt,assets,card,interest,claims,liabilities,net:assets+claims-liabilities,usable:usableCash()}}
function moneyOverview(){const a=assetSummary(),{debt,assets}=a;return `<section class="c"><h2>お金の総合管理</h2><div class="tilegrid"><div class="tile">記録済み資産<b>${F(assets)}</b></div><div class="tile">純資産（概算）<b>${F(a.net)}</b></div><div class="tile">負債総額（概算）<b>${F(a.liabilities)}</b></div><div class="tile">借入元金<b>${F(debt)}</b></div><div class="tile">カード未払い（登録分）<b>${F(a.card.total)}</b></div><div class="tile">経過利息（概算）<b>${F(a.interest)}</b></div><div class="tile">積立保護後の手元資金<b>${F(a.usable)}</b></div><div class="tile">未回収の立替金<b>${F(claimTotals())}</b></div><div class="tile">目的別貯金<b>${S.moneyGoals.length}件</b></div><div class="tile">ポイント等（資産外）<b>${F(rewardValue())}</b></div></div><div class="row"><button class="s" onclick="go('inc','claimsanchor')">立替・精算</button><button class="s" onclick="go('acct','moneygoals')">貯金目標</button><button class="s" onclick="go('acct','annualmoney')">年間収支</button></div><div class="m">純資産＝記録済み資産＋未回収立替金−借入元金−カード未払い−経過利息。カードは利用実績・登録分割払い・確定請求から支払済み額を控除し、将来の予算・未登録固定費は含めません。分割払いと通常利用を重複登録しないでください。積立保護後の手元資金は支払予定控除前です。</div></section>`}
function rewardValue(){return S.rewardBalances.reduce((n,x)=>n+Math.max(0,N(x.balance))*Math.max(0,N(x.yenRate)),0)}
function createReward(name,kind,balance,yenRate,expiry=""){name=String(name).trim();if(!name||!["point","restricted"].includes(kind)||!Number.isSafeInteger(balance)||balance<0||!Number.isFinite(yenRate)||yenRate<0||yenRate>100000||(expiry&&!csvDate(expiry)))throw Error("名称・残高・換算率・期限を確認してください");if(S.rewardBalances.some(x=>x.name===name))throw Error("同じ名称が登録済みです");const x={id:uid(),name,kind,balance,yenRate,expiry};S.rewardBalances.push(x);return x}
function changeReward(id,delta,date,reason){const x=S.rewardBalances.find(x=>x.id===id);if(!x||!Number.isSafeInteger(delta)||!delta||!csvDate(date)||date>today()||!Number.isSafeInteger(x.balance+delta)||x.balance+delta<0)throw Error("残高・金額・日付を確認してください");x.balance+=delta;S.rewardHistory.push({id:uid(),reward:id,date,delta,reason:String(reason||"残高調整").slice(0,100)});return x}
function addRewardUI(){try{createReward($("#rwname").value,$("#rwkind").value,Number($("#rwbal").value),Number($("#rwrate").value),$("#rwexpiry").value);save();R()}catch(e){alert(e.message)}}
function rewardAdjust(i,sign){const x=S.rewardBalances[i];if(!x)return;const v=prompt(sign>0?"獲得・追加した数量":"使用・失効した数量","");if(v===null||!v.trim())return;const n=Number(v);if(!Number.isSafeInteger(n)||n<=0){alert("正の整数を入力してください");return}try{changeReward(x.id,sign*n,today(),sign>0?"獲得・追加":"使用・失効");save();R()}catch(e){alert(e.message)}}
function editReward(i){const x=S.rewardBalances[i];if(!x)return;const rate=prompt("1単位の円換算目安",String(x.yenRate));if(rate===null)return;const exp=prompt("次回有効期限（YYYY-MM-DD、空欄可）",x.expiry||"");if(exp===null)return;if(!rate.trim()||!Number.isFinite(+rate)||+rate<0||+rate>100000||(exp&&!csvDate(exp))){alert("換算率・期限を確認してください");return}x.yenRate=+rate;x.expiry=exp;save();R()}
function rewardPanel(){return `<section class="c" id="rewardanchor"><h2>ポイント・用途限定残高</h2><div class="tilegrid"><div class="tile">参考換算額<b>${F(rewardValue())}</b></div><div class="tile">登録サービス<b>${S.rewardBalances.length}件</b></div></div><div class="m">ポイントや商品券などを現金・純資産・返済可能額とは別に管理します。既存のPayPay残高など口座管理に登録済みの電子マネーは重複登録しないでください。</div>${S.rewardBalances.map((x,i)=>`<div class="cardbill"><b>${E(x.name)}</b><div class="v">${N(x.balance).toLocaleString()} ${x.kind==="point"?"pt":"単位"}</div><div class="m">参考 ${F(N(x.balance)*N(x.yenRate))} ／ 期限 ${E(x.expiry||"未設定")}</div>${x.expiry&&x.expiry<=plusDays(today(),30)&&x.balance>0?`<div class="w">${x.expiry<today()?"期限経過：残高を確認":"30日以内に期限到来"}</div>`:""}<div class="row"><button class="s" onclick="rewardAdjust(${i},1)">＋ 獲得</button><button class="s" onclick="rewardAdjust(${i},-1)">− 使用・失効</button><button class="s" onclick="editReward(${i})">期限・換算率編集</button></div></div>`).join("")}<details><summary>サービスを追加</summary><div class="row"><label>名称<input id="rwname" placeholder="Vポイントなど"></label><label>区分<select id="rwkind"><option value="point">ポイント</option><option value="restricted">商品券・用途限定残高</option></select></label></div><div class="row"><label>現在の数量<input id="rwbal" type="number" min="0" value="0"></label><label>1単位の円換算目安<input id="rwrate" type="number" min="0" step="0.01" value="1"></label><label>次回期限<input id="rwexpiry" type="date"></label></div><button onclick="addRewardUI()">追加</button></details><details><summary>獲得・使用履歴</summary>${S.rewardHistory.slice().reverse().slice(0,50).map(x=>`<div class="eventline"><span>${E(x.date)} ${E(S.rewardBalances.find(r=>r.id===x.reward)?.name||"")} ${E(x.reason)}</span><b>${x.delta>0?"+":""}${N(x.delta)}</b></div>`).join("")||"記録なし"}</details><div class="m">ポイントの使用は現金支出を自動登録しません。家計簿には実際に現金等で支払った部分を記録してください。期限はサービス全体の次回期限のメモです。</div></section>`}
function V_acct(){if(!S.accts.length)return rewardPanel()+fiveAccountPanel()+`<div class="c"><h2>口座管理</h2>候補口座(三菱UFJ・イオン・PayPay銀行・みんなの銀行・ゆうちょ・現金・PayPay残高)を作成します。現在の手元資金${F(S.cash)}は「未割当」口座に入り、振替で各口座へ移せます。<div class="row"><button onclick="accInit()">口座管理を開始</button></div></div>`;
const o=S.accts.map(a=>`<tr><td><input data-k="accts.${S.accts.indexOf(a)}.name" value="${E(a.name)}" style="width:120px"></td><td><input data-k="accts.${S.accts.indexOf(a)}.purpose" value="${E(a.purpose||"")}" style="width:90px"></td><td><input type="number" data-k="accts.${S.accts.indexOf(a)}.bal" value="${a.bal}" style="width:84px"></td><td><input type="number" data-k="accts.${S.accts.indexOf(a)}.target" value="${a.target||0}" style="width:84px"></td><td><select data-k="accts.${S.accts.indexOf(a)}.emg"><option value="">通常</option><option value="1" ${a.emg?"selected":""}>緊急貯金</option></select></td><td>${a.target?Math.round(N(a.bal)/a.target*100)+"%":""}</td></tr>`).join("");
const opt=S.accts.map(a=>`<option value="${a.id}">${E(a.name)}</option>`).join("");
return rewardPanel()+fiveAccountPanel()+moneyGoalsPanel()+annualMoneyPanel()+gambleGuardPanel()+transferPanel()+accountForecastPanel()+trendPanel()+accountLinks()+reconcilePanel()+`<div class="c"><h2>口座</h2><div class="sc"><table><tr><th>名前</th><th>用途</th><th>残高</th><th>目標</th><th>区分</th><th>達成</th></tr>${o}</table></div><div class="m">手元資金 ${F(S.cash)} / 緊急貯金 ${F(S.emerg)}(口座残高の合計から自動計算)</div><div class="row"><input id="an" placeholder="口座名"><button class="s" onclick="S.accts.push({id:uid(),name:$('#an').value||'新口座',bal:0});save();R()">追加</button></div></div>
<div class="c"><h2>口座間の振替</h2><div class="row"><select id="xf">${opt}</select>→<select id="xt">${opt}</select><input type="number" id="xa" placeholder="金額"><button onclick="xfer()">振替</button></div><div class="m">振替は収入・支出に計上されません。緊急貯金口座からの振替は警告します。</div></div>`}
function accInit(){const L=[["未割当(手元資金)","振替前の残高",S.cash],["三菱UFJ銀行","給与受取・借金返済・カード引落"],["イオン銀行","生活費"],["PayPay銀行","自由費"],["みんなの銀行","緊急貯金",0,1],["ゆうちょ銀行","娯楽費の上限管理"],["現金","現金"],["PayPay残高","PayPay"]];S.accts=L.map(([n,p,b,e])=>({id:uid(),name:n,purpose:p,bal:b||0,emg:e?"1":""}));if(S.emerg>0)S.accts[4].bal=S.emerg;logA("口座管理開始");sync();save();R()}
function xfer(){const f=S.accts.find(a=>a.id==$("#xf").value),t=S.accts.find(a=>a.id==$("#xt").value),a=N($("#xa").value);if(!f||!t||f==t||a<=0||!Number.isSafeInteger(a))return;if(a>N(f.bal)){alert("振替元の残高が不足しています");return}if(protectedEntertainmentTransfer(f,t,a)){alert("娯楽費口座への追加補填は停止中です。すでに実際に振替を行った場合は残高照合で記録してください。");return}if(f.emg&&!confirm("緊急貯金口座から取り崩します。よろしいですか?"))return;f.bal-=a;t.bal=N(t.bal)+a;sync();logA("振替 "+f.name+"→"+t.name+" "+a);save();R()}
function addTx(){const a=N($("#ta").value);if(!csvDate($("#td").value)||a<=0||!Number.isSafeInteger(a)){alert("支出額を入力してください");return}const p=paymentValue($("#tp").value);if(!p){alert("使ったカードまたは支払い方法を選択してください");return}if($("#tc").value==="ギャンブル"&&!gamblingRecordWarning($("#td").value,a)){R();return;}S.tx.push({id:uid(),date:$("#td").value,amt:a,cat:$("#tc").value,pm:p.pm,card:p.card,acct:chooseAccount(p.pm)?.id||"",memo:$("#tm").value});pAdj(p.pm,-a,S.tx.at(-1).acct);if($("#tc").value==="ギャンブル"&&ym($("#td").value)===ym(today()))persistGambleStop();S.cfg.lastPay=$("#tp").value;logA("支出 "+a);discardForm("tx");save();R()}
function delTx(id){if(!confirm("この支出記録を削除しますか？"))return;const x=S.tx.find(t=>t.id==id);if(x){if(x.balanceApplied!==false)pAdj(x.pm,N(x.amt),x.acct);if(x.recKey)delete S.recDone[x.recKey]}S.tx=S.tx.filter(t=>t.id!=id);logA("支出削除");save();R()}
function approve(){const i=S.inc[sel];if(!i||!i.actual||S.plans.some(p=>p.inc===i.id)){alert("登録済みまたは未入金です");return}const a=alloc(N(i.amt),strat,i.id);if(!a.items.length){alert("配分できる資金がありません");return}S.plans.push({id:uid(),inc:i.id,items:a.items.map(x=>({...x,done:false}))});logA("配分承認 "+ST[strat]);save();R()}
function doneItem(p,x){const it=S.plans[p]?.items[x];if(!it||it.done)return;if(it.type=="rep"){const d=S.debts.find(d=>d.id==it.debtId);if(!d)return;const v=prompt("実際の支払額に含まれる利息(円)を入力",accrued(d)??"");if(v===null||v.trim()===""||!Number.isFinite(Number(v)))return;if(!confirm("実際の返済を記録します。銀行での支払いは済んでいますか？"))return;if(!recordPayment(d,it.amt,Number(v)))return}else if(it.type=="emg"){if(it.amt>S.cash){alert("手元資金不足");return}const income=S.inc.find(i=>i.id===S.plans[p].inc),src=chooseAccount("salary",income?.acct),dst=purposeAccount("emergency");if(S.accts.length&&(!src||!dst||N(src.bal)<it.amt)){alert("給与口座・緊急貯金口座と残高を確認してください");return}if(!confirm("実際の緊急貯金への移動を記録しますか？"))return;adj(-it.amt,src?.id);adj(it.amt,dst?.id,true);S.emgPaid[ym(today())]=N(S.emgPaid[ym(today())])+it.amt}it.done=true;logA("実績登録 "+it.label+" "+it.amt);save();R()}

function recordPayment(d,a,ie){if(!d||!Number.isSafeInteger(a)||!Number.isSafeInteger(ie)||a<=0||a>S.cash||ie<0||ie>a||a-ie>d.bal){alert("支払額・利息・手元資金を確認してください");return false}const ac=chooseAccount("repay",d.acct);if(ac&&N(ac.bal)<a){alert("返済口座の残高不足："+ac.name);return false}const accruedNow=accrued(d);d.bal=Math.max(0,d.bal-(a-ie));d.paidInterest=N(d.paidInterest)+ie;d.carryInterest=Math.max(0,(accruedNow??ie)-ie);d.lastDate=today();const key=paidKey(ym(today()),d.id);S.debtPaid[key]=N(S.debtPaid[key])+a;S.paylog.push({date:today(),debt:d.id,principal:a-ie,interest:ie,amount:a,acct:ac?.id||""});adj(-a,ac?.id);logA("返済実績 "+d.name+" 支払"+a+"(元金"+(a-ie)+"/利息"+ie+")");return true}
function repay(){const d=S.debts.find(d=>d.id==$("#rd").value),a=N($("#ra").value);if(!d||!a)return;const ie=$("#ri").value===""?accrued(d):N($("#ri").value);if(ie==null){alert("利息計算開始日または実際の利息を入力してください");return}if(recordPayment(d,a,ie)){discardForm("debt");save();R()}}
