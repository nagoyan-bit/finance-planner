<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#0f6e56;--wn:#b3261e;--bd:#e0ded6}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--sf:#222220;--tx:#eeeeea;--mu:#9a9a94;--ac:#4fc3a1;--wn:#ff8a80;--bd:#383835}}
:root[data-theme=dark]{--bg:#171716;--sf:#222220;--tx:#eeeeea;--mu:#9a9a94;--ac:#4fc3a1;--wn:#ff8a80;--bd:#383835}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:70px}

.w{color:var(--wn)}.m{color:var(--mu);font-size:12px}

input[type=number]{width:100px}button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 2px;font-size:12px}nav button.on{color:var(--ac);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}

body{padding-bottom:calc(86px + env(safe-area-inset-bottom));font-size:15px}main{max-width:800px;padding:14px}.c{padding:16px;border-radius:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}h2{font-size:17px;margin-bottom:12px}.g{gap:14px}.v{font-size:22px;font-variant-numeric:tabular-nums}.k,.m{line-height:1.65}input,select,button{min-height:44px;font-size:16px}button{background:#0f6e56;color:white;font-weight:600}button.s{background:transparent;color:var(--ac)}.row{gap:8px;margin:9px 0}.bar{height:10px}td,th{padding:8px 6px}nav{z-index:10;max-width:800px;margin:auto;box-shadow:0 -3px 14px #00000010}nav button{min-height:62px;font-size:10px;padding:8px 1px;min-width:0}nav button.on{background:#0f6e5618;border-radius:12px}nav .ni{display:block;font-size:21px;margin-bottom:5px}.hero{background:#124b40;color:white;padding:20px;border:0}.hero .k,.hero .m{color:#d6eae2}.hero .v{font-size:32px}.hero .g{margin-top:16px;padding-top:14px;border-top:1px solid #ffffff30}.hero .g .v{font-size:21px}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.quick button{min-height:60px;font-size:14px;padding:7px 2px}.pagehead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.pagehead h1{font-size:22px;margin:0}.pagehead small{color:var(--mu)}.debtcard{border:1px solid var(--bd);border-radius:12px;padding:13px;margin:10px 0}.debtcard label{display:grid;gap:4px;min-width:0;font-size:12px;color:var(--mu)}.debtcard input{width:100%;min-width:0}.debtcard summary{padding:10px 0;color:var(--ac);cursor:pointer}.formmain .row input,.formmain .row select{flex:1;min-width:100px}.formmain button:not(.s){width:100%;margin-top:6px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}@media(max-width:380px){main{padding:10px}.c{padding:12px}nav button{font-size:9px}.hero .v{font-size:28px}}
</style></head><body><main id="app">読み込み中…</main>
<nav id="nav"></nav>
<script>
const TABS=[["home","ホーム"],["inc","収入配分"],["tx","家計簿"],["cal","予定"],["acct","口座"],["debt","借金"],["set","設定"]];
let S=null,tab="home",sel=0,strat="prio",msg="";
const $=s=>document.querySelector(s),N=x=>Number(x)||0,F=n=>Math.round(N(n)).toLocaleString()+"円";
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ym=d=>d.slice(0,7),addM=(m,n)=>{let[y,mo]=m.split("-").map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12)+1;return y+"-"+String(mo).padStart(2,"0")};
const uid=()=>Math.random().toString(36).slice(2,9);
const ST={prio:"ユーザー優先順位",fast:"最速完済(最低返済解放優先)",rate:"利息最小化(高金利順)",count:"借入件数削減(残高少順)",cash:"手元資金重視"};
const CATS=["食費","交通費","日用品","交際費","娯楽費","保険料","通信費","ギャンブル","その他"],PM={credit:"クレジットカード",cash:"現金",paypay:"PayPay残高払い",paypaycr:"PayPayクレジット"};
function blank(){return{debts:[],family:{bal:0,monthly:0},cash:0,emerg:0,cfg:{living:0,free:0,fam:0,emgTarget:0,emgBy:today().slice(0,7),reserve:0,salTarget:0,gamble:0},cards:[{id:"c1",name:"カード1",close:null,pay:null}],plan:{},inc:[],tx:[],bud:{total:0,credit:0,cash:0,paypay:0,fixed:{credit:0,cash:0,paypay:0}},plans:[],log:[],accts:[],inst:[],conf:{},jobs:[],rec:[],recDone:{}}}
function minFor(d,b){const t=String(d.tiers||"").split(",").map(x=>x.split(":").map(Number)).filter(x=>x[0]>0&&x[1]>=0).sort((a,b)=>a[0]-b[0]);for(const[l,m]of t)if(b<=l)return m;return N(d.min)}
function salCard(){const y="2027",cur=ym(today()),act=S.inc.filter(x=>x.actual&&x.type=="給与"&&x.date.startsWith(y)),by={};act.forEach(x=>{const k=x.job||"未指定";by[k]=(by[k]||0)+N(x.amt)});const a=act.reduce((s,x)=>s+N(x.amt),0),got=new Set(act.map(x=>ym(x.date))),rem=Object.keys(S.plan).filter(m=>m.startsWith(y)&&m>=cur&&!got.has(m)).reduce((s,m)=>s+N(S.plan[m].sal),0),f=a+rem,t=N(S.cfg.salTarget);
return`<div class="c"><h2>年間給与(${y}年)</h2>${bar(f,t)}<div class="m">実績${F(a)} + 今後の計画${F(rem)} = 見込み${F(f)} / 目標${F(t)} 残り枠${F(t-f)} ${f>t?'<span class="w">⚠ 目標超過見込み</span>':""}</div>${Object.entries(by).map(([k,v])=>`<div class="row">${E(k)} ${F(v)}</div>`).join("")}<div class="row"><input id="jn" placeholder="勤務先を追加(TA等)"><button class="s" onclick="if($('#jn').value){S.jobs.push($('#jn').value);save();R()}">追加</button></div><div class="m">親の援助・交通費精算は給与に含めません。扶養の可否は税法上と健康保険上で別制度のため、年収だけでは判断できません。</div></div>`}
let calM=null;
function dueDay(m,c){const[y,mo]=m.split("-").map(Number),dt=new Date(y,mo-1,c.pay||27),w=dt.getDay();if(w==6)dt.setDate(dt.getDate()+2);if(w==0)dt.setDate(dt.getDate()+1);return dt.getMonth()+1==mo?dt.getDate():dt.getDate()}
function V_cal(){const m=calM||ym(today()),[y,mo]=m.split("-").map(Number),first=new Date(y,mo-1,1).getDay(),days=new Date(y,mo,0).getDate(),ev={},add=(d,t)=>{(ev[d]=ev[d]||[]).push(t)};
S.inc.filter(x=>ym(x.date)==m).forEach(x=>add(+x.date.slice(8),`<span style="color:var(--ac)">+${Math.round(N(x.amt)/100)/10}k${x.actual?"":"(予)"}</span>`));
const sp={},du={};S.tx.filter(x=>ym(x.date)==m).forEach(x=>{const d=+x.date.slice(8);sp[d]=(sp[d]||0)+N(x.amt)});for(const d in sp)add(d,`−${Math.round(sp[d]/100)/10}k`);
S.tx.filter(x=>x.pm=="credit"||x.pm=="paypaycr").forEach(t=>{const bd=billing(t.date,S.cards.find(c=>c.id==t.card)||S.cards[0]);if(ym(bd)==m){const d=+bd.slice(8);du[d]=(du[d]||0)+N(t.amt)}});
S.inst.forEach(i=>instRows(i).forEach(([mm,a])=>{if(mm==m){const d=dueDay(m,S.cards.find(c=>c.id==i.card)||S.cards[0]);du[d]=(du[d]||0)+a}}));for(const d in du)add(d,`<span class="w">請求${Math.round(du[d]/100)/10}k</span>`);
let cells="";for(let i=0;i<first;i++)cells+="<div></div>";for(let d=1;d<=days;d++)cells+=`<div style="min-height:54px;border:1px solid var(--bd);border-radius:4px;font-size:10px;padding:2px;overflow:hidden"><b>${d}</b>${(ev[d]||[]).map(t=>"<div>"+t+"</div>").join("")}</div>`;
return`<div class="c"><div class="row"><button class="s" onclick="calM=addM('${m}',-1);R()">←</button><b>${y}年${mo}月</b><button class="s" onclick="calM=addM('${m}',1);R()">→</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${["日","月","火","水","木","金","土"].map(x=>`<div class="k">${x}</div>`).join("")}${cells}</div><div class="m">緑=収入(予)=予定、黒=支出合計、赤=カード請求日(土日は翌月曜)</div></div>`}
let xm=0;
function whatIf(r){const w=sim(strat,{xm});return`<div class="c"><h2>もし毎月追加で返済できたら</h2><div class="row"><input type="number" value="${xm}" onchange="xm=N(this.value);R()">円/月</div><div class="m">総支払利息 ${F(r.int)} → ${F(w.int)}(${F(r.int-w.int)}削減)/完済 ${r.end} → ${w.end}</div></div>`}
function addRec(){const a=N($("#ra2").value);if(!a)return;S.rec.push({id:uid(),name:$("#rn").value||"固定費",amt:a,day:N($("#rd2").value)||1,cat:$("#rc").value,pm:$("#rp").value,card:S.cards[0].id});save();R()}
function applyRec(){const t=today(),m=ym(t),d=+t.slice(8);let n=0;S.rec.forEach(r=>{const k=r.id+m;if(!S.recDone[k]&&r.day<=d){S.tx.push({id:uid(),date:m+"-"+String(r.day).padStart(2,"0"),amt:r.amt,cat:r.cat,pm:r.pm,card:r.card,memo:r.name});pAdj(r.pm,-r.amt);S.recDone[k]=1;n++}});logA("固定費反映 "+n+"件");save();R()}
function backCalc(st){const p=S.plan[addM(ym(today()),9)];if(!p)return null;const s8=N(p.sal)+N(p.parent)+N(p.other)-N(S.cfg.living)-N(S.cfg.free)-N(p.fam)-N(p.card)-N(p.emg);for(let x=0;x<=100000;x+=1000){const r=sim(st,{xm:x});if(r.min0<=s8&&!r.warn.length)return{x,min0:r.min0,s8}}return{x:null,min0:sim(st).min0,s8}}
function backCard(){const b=backCalc(strat);if(!b)return"";return`<h3>約9か月後以降への備え(逆算)</h3><div class="m">8月の返済可能額 ${F(b.s8)} / 現計画での最低返済 ${F(b.min0)}。${b.x==null?"毎月10万円の追加返済でも足りません。計画の見直しが必要です。":b.x==0?"現計画で約9か月後以降の最低返済を賄えます。":`平均して毎月${F(b.x)}の追加返済(臨時収入を含む)を前半に確保すると、約9か月後以降の最低返済を賄えます。`}</div>`}
function famCard(){const f=S.family,m=Math.max(1,N(S.cfg.fam)),n=Math.ceil(N(f.bal)/m);return`<div class="c"><h2>家族への借金</h2><div class="m">残高${F(f.bal)} / 毎月${F(m)}で完済予定 ${f.bal>0?addM(ym(today()),n):"完済"}(${n}か月)</div>${bar(N(f.bal0||f.bal)-N(f.bal),N(f.bal0||f.bal))}<div class="row"><input type="number" id="fa" placeholder="返済額"><button onclick="famPay()">返済実績を登録</button></div></div>`}
function famPay(){const f=S.family,a=N($("#fa").value);if(!a)return;if(!f.bal0)f.bal0=f.bal;f.bal=Math.max(0,f.bal-a);adj(-a);logA("家族へ返済 "+a);save();R()}
function miles(){const d=S.debts.filter(d=>d.bal<=0);return d.length?`<div class="m">🎉 完済: ${d.map(x=>E(x.name)).join("、")} / 最低返済 −${F(d.reduce((s,x)=>s+N(x.min),0))}/月</div>`:""}
function review(){const m=ym(today()),pm=addM(m,-1),by=mm=>{const o={};S.tx.filter(x=>ym(x.date)==mm).forEach(x=>o[x.cat]=(o[x.cat]||0)+N(x.amt));return o},a=by(m),b=by(pm),tot=Object.values(a).reduce((s,v)=>s+v,0),up=Object.keys(a).map(k=>[k,a[k]-(b[k]||0)]).sort((x,y)=>y[1]-x[1])[0],tb=N(S.bud.total);
return`<div class="c"><h2>月次の振り返り</h2><div class="m">今月の支出 ${F(tot)} / 総予算 ${F(tb)}(${tb?Math.round(tot/tb*100):0}%) ${tot>tb?'<span class="w">超過</span>':""}</div>${["credit","cash","paypay"].map(k=>{const x=budget(k);return x.b?`<div class="m">${PM[k]}: ${F(x.used)}/${F(x.b)}${x.over?' <span class="w">超過'+F(x.over)+"</span>":""}</div>`:""}).join("")}${up&&up[1]>0?`<div class="m">前月より増えた項目: ${E(up[0])}(+${F(up[1])})</div>`:""}</div>`}
function ledger(){const a=S.inc.filter(x=>x.actual);if(!a.length)return"";return`<div class="c"><h2>入金ごとの使い道</h2>${a.map(x=>{const ps=S.plans.filter(p=>p.inc==x.id),it=ps.flatMap(p=>p.items),st=!ps.length?'<span class="w">未承認</span>':it.every(i=>i.done)?"実績登録済み":it.filter(i=>i.done).length+"/"+it.length+" 実績登録";return`<div class="row">${x.date.slice(5)} ${F(x.amt)} ${E(x.type)} — ${st}</div>`}).join("")}</div>`}
async function csvOut(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',rows=[["日付","金額","カテゴリー","支払い方法","メモ"],...S.tx.map(x=>[x.date,x.amt,x.cat,PM[x.pm],x.memo]),[],["入金日","金額","種類","区分"],...S.inc.map(x=>[x.date,x.amt,x.type,x.actual?"実績":"予定"])];try{if(dl)await dl.save({filename:"kakeibo.csv",data:"\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")});else browserSave("kakeibo.csv","\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n"))}catch(e){msg="保存をキャンセルしました"}R()}
function gcap(){return S.cfg.gamble==null?20000:N(S.cfg.gamble)}
function gUsed(){return S.tx.filter(x=>x.cat=="ギャンブル"&&ym(x.date)==ym(today())).reduce((s,x)=>s+N(x.amt),0)}
function notes(){const n=[],last=S.lastBk,days=last?Math.floor((Date.now()-new Date(last))/864e5):null;if(S.debts.length&&(last==null||days>=30))n.push("バックアップが"+(last?days+"日前です":"未実施です")+"(設定→JSON保存)");if(S.debts.length&&S.debts.every(d=>N(d.rate)==18))n.push("金利がすべて仮の18%です。実際の金利を入れると利息最小化の提案が変わります");if(S.cards.some(c=>!c.close||!c.pay))n.push("カードの締め日・支払日が未入力です(家計簿→カード設定)");const g=gcap(),u=gUsed();
return(n.length?`<div class="c"><h2>確認してください</h2>${n.map(x=>`<div class="m">・${x}</div>`).join("")}</div>`:"")+`<div class="c"><h2>ギャンブル(月${F(g)}まで)</h2>${bar(u,g)}<div class="m">今月 ${F(u)} / 残り ${F(Math.max(0,g-u))} ${u>g?'<span class="w">上限超過 '+F(u-g)+"</span>":""}</div></div>`}
function dim(m){return new Date(+m.slice(0,4),+m.slice(5),0).getDate()}
function accrued(d){if(d.bal<=0)return 0;if(!d.lastDate)return null;const days=Math.max(0,Math.round((Date.parse(today())-Date.parse(d.lastDate))/864e5));return Math.floor(d.bal*N(d.rate)/100/365*days)+N(d.carryInterest)}
function interestPanel(){const ds=S.debts.filter(d=>d.bal>0),daily=ds.reduce((a,d)=>a+d.bal*N(d.rate)/36500,0);return `<div class="c"><h2>利息管理</h2><div class="g"><div>1日あたり<div class="v">${F(daily)}</div></div><div>今月相当<div class="v">${F(daily*dim(ym(today())))}</div></div><div>年間相当(残高一定)<div class="v">${F(daily*365)}</div></div><div>登録済み支払利息<div class="v">${F(S.debts.reduce((a,d)=>a+N(d.paidInterest),0))}</div></div></div><div class="sc"><table><tr><th>借入先</th><th>利息計算開始日</th><th>日額</th><th>月額目安</th><th>最低返済の元金目安</th><th>経過利息</th></tr>${ds.map(d=>{const i=d.bal*N(d.rate)/36500,mi=i*dim(ym(today()));return `<tr><td>${E(d.name)}</td><td><input type="date" data-k="debts.${S.debts.indexOf(d)}.lastDate" value="${E(d.lastDate||'')}"></td><td>${F(i)}</td><td>${F(mi)}</td><td>${F(Math.max(0,minFor(d,d.bal)-mi))}</td><td>${accrued(d)==null?'日付未設定':F(accrued(d))}</td></tr>`}).join('')}</table></div><div class="m">年利÷365×元金×経過日数。開始日は現在の元金に対する利息起算日を入力。月額・年額は残高一定の概算。実際の請求利息を優先してください。</div></div>`}

function instRows(i){const n=N(i.months),p=N(i.total)/n,o=[];for(let k=0;k<n;k++)o.push([addM(i.start,k),Math.round(p+(N(i.total)-p*k)*N(i.fee)/1200)]);return o}
function pAdj(pm,d){if(pm=="cash")adj(d);else if(pm=="paypay")adj(d,(S.accts.find(a=>a.name=="PayPay残高")||{}).id)}
function initialIfEmpty(){return false}
function load(raw){try{S=Object.assign(blank(),JSON.parse(raw))}catch(e){S=blank()}}
function sync(){if(S.accts.length){S.cash=S.accts.filter(a=>!a.emg).reduce((s,a)=>s+N(a.bal),0);S.emerg=S.accts.filter(a=>a.emg).reduce((s,a)=>s+N(a.bal),0)}}
function adj(d,id,emg){if(S.accts.length){const a=S.accts.find(x=>x.id==id)||S.accts.find(x=>!!x.emg==!!emg)||S.accts[0];a.bal=N(a.bal)+d;sync()}else{if(emg)S.emerg+=d;else S.cash+=d}}
function save(){try{localStorage.setItem("dp",JSON.stringify(S))}catch(e){msg="この端末で保存できません。ブラウザの設定を確認してください。"}}
function logA(t){S.log.unshift({t:new Date().toISOString().slice(0,16),a:t});S.log=S.log.slice(0,60)}
/* ---- シミュレーション ---- */
function order(ds,st){const a=ds.filter(d=>d.bal>0);if(st=="rate")return a.sort((x,y)=>y.rate-x.rate||x.bal-y.bal);if(st=="count")return a.sort((x,y)=>x.bal-y.bal);if(st=="fast")return a.sort((x,y)=>y.min/y.bal-x.min/x.bal);return a}
function sim(st,o={}){const ds=(o.debts||S.debts).map(d=>({...d})),st0=ds.map(d=>d.bal);let pool=o.pool??S.cash,res={},int=0,short=[],warn=[],gap=0,ms=Object.keys(S.plan).sort(),min0=null,hist=[];const rsv=N(S.cfg.reserve)+(st=="cash"?30000:0);
for(const m of ms){const p=S.plan[m];pool+=N(o.xm)-(S.cfg.gambleInPlan?gcap():0)+N(p.sal)+N(p.parent)+N(p.other)-N(S.cfg.living)-N(S.cfg.free)-N(p.fam)-N(p.emg)-N(p.card);
let mins=0;for(const d of ds){if(d.bal<=0)continue;const i=d.bal*d.rate/100/365*dim(m);d.bal+=i;int+=i;const pay=Math.min(minFor(d,d.bal),d.bal);d.bal-=pay;mins+=pay;if(d.bal<=0.5){d.bal=0;res[d.id]=m}}
pool-=mins;if(pool<0)short.push(m);if(pool<rsv-0.5)warn.push(m);gap=Math.max(gap,rsv-pool);if(m===addM(ym(today()),9))min0=ds.reduce((s,d)=>s+(d.bal>0?minFor(d,d.bal):0),0);
let ex=Math.max(0,pool-rsv);for(const d of order(ds,st)){if(ex<=0)break;const x=Math.min(ex,d.bal);d.bal-=x;ex-=x;pool-=x;if(d.bal<=0.5){d.bal=0;res[d.id]=res[d.id]||m}}
hist.push([m,ds.reduce((s,d)=>s+d.bal,0)])}
const left=ds.reduce((s,d)=>s+d.bal,0);return{res,int,short,warn,gap,min0,hist,left,end:ds.every(d=>d.bal<=0)?Object.values(res).sort().pop()||"-":"期間内に完済不可",pool}}
/* ---- 臨時収入の配分 ---- */
function alloc(amt,st){const cur=ym(today()),cm=Object.keys(S.plan).sort().find(m=>m>=cur&&N(S.plan[m].card)>0);const due=cm?N(S.plan[cm].card):0;
let left=Math.min(amt,Math.max(0,S.cash)),items=[];const need=Math.min(left,Math.max(0,due+N(S.cfg.reserve)-Math.max(0,S.cash-left)));if(need>0){items.push({type:"need",label:"必要支払いの確保(カード支払い準備金)",amt:need});left-=need}
const gap=Math.max(0,N(S.cfg.emgTarget)-S.emerg),mths=Math.max(1,(()=>{const[a,b]=S.cfg.emgBy.split("-").map(Number),[c,d]=cur.split("-").map(Number);return(a-c)*12+b-d+1})()),emg=Math.min(left,Math.ceil(gap/mths/1000)*1000,gap);if(emg>0){items.push({type:"emg",label:"緊急貯金",amt:emg});left-=emg}
const g=Math.min(left,Math.ceil(Math.max(0,sim(st).gap)/1000)*1000);if(g>0){items.push({type:"hold",label:"将来の資金不足に備える準備金",amt:g});left-=g}
if(st=="cash"){const h=Math.floor(left*.3/1000)*1000;left-=h}
const ds=order(S.debts,st);for(const d of ds){if(left<=0)break;const x=Math.min(left,d.bal);items.push({type:"rep",debtId:d.id,label:d.name+" 追加返済",amt:x});left-=x}
return{items,left}}
function effect(items){const ds=S.debts.map(d=>({...d}));let pool=S.cash;for(const i of items)if(i.type=="rep"){ds.find(d=>d.id==i.debtId).bal-=i.amt}
const a=sim(strat),b=sim(strat,{debts:ds,pool:pool-items.filter(i=>i.type=="rep"||i.type=="emg").reduce((a,i)=>a+i.amt,0)});return{a,b,min:ds.filter(d=>d.bal<=0).reduce((s,d)=>s+d.min,0)}}

function billing(date,c){const[y,m,d]=date.split("-").map(Number),close=c.close||31,pm=m+(d<=close?1:2);let dt=new Date(y,pm-1,c.pay||27);const w=dt.getDay();if(w==6)dt.setDate(dt.getDate()+2);if(w==0)dt.setDate(dt.getDate()+1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}

function addInst(){const t=N($("#it2").value),m=N($("#im").value),s=$("#is").value;if(!t||!m||!/^\d{4}-\d{2}$/.test(s))return;S.inst.push({id:uid(),name:$("#in").value||"分割",card:$("#ic2").value,total:t,months:m,start:s,fee:N($("#if").value)});logA("分割払い登録 "+t);save();R()}
function debtCards(r){return S.debts.map((d,i)=>`<article class="debtcard"><div class="row" style="justify-content:space-between"><strong>${E(d.name)}</strong><span class="m">${d.bal>0?"返済中":"完済"}</span></div><div class="v">${F(d.bal)}</div><div class="m">最低 ${F(d.bal>0?minFor(d,d.bal):0)} / 月　年利 ${N(d.rate)}%</div>${bar(Math.max(0,N(d.bal0||d.bal)-N(d.bal)),N(d.bal0||d.bal))}<details><summary>残高・金利・返済日を編集</summary><div class="g"><label>借入先<input data-k="debts.${i}.name" value="${E(d.name)}"></label><label>残高（円）<input type="number" min="0" data-k="debts.${i}.bal" value="${N(d.bal)}"></label><label>最低返済額<input type="number" min="0" data-k="debts.${i}.min" value="${N(d.min)}"></label><label>年利（%）<input type="number" step="0.01" min="0" data-k="debts.${i}.rate" value="${N(d.rate)}"></label><label>返済日<input type="number" min="1" max="31" data-k="debts.${i}.day" value="${d.day??""}"></label><label>利息起算日<input type="date" data-k="debts.${i}.lastDate" value="${E(d.lastDate||"")}"></label><label>段階最低額<input data-k="debts.${i}.tiers" value="${E(d.tiers||"")}" placeholder="100000:3000"></label></div><div class="row"><button class="s" onclick="mv(${i},-1)">↑ 優先</button><button class="s" onclick="mv(${i},1)">↓ 後回し</button></div></details><div class="m">完済必要額：${d.bal<=0?"0円":accrued(d)==null?"起算日未設定":F(d.bal+accrued(d))}　予定：${d.bal<=0?"完済":E(r.res[d.id]||"未算出")}</div></article>`).join("")}
function newDebt(){const name=prompt("借入先の名前");if(!name?.trim())return;const v=prompt("現在の元金残高（円）","0");if(v===null||v.trim()===""||!Number.isFinite(Number(v))||Number(v)<0)return;const bal=Math.round(Number(v));S.debts.push({id:uid(),name:name.trim(),bal,bal0:bal,min:0,rate:0,day:null,tiers:"",lastDate:null,paidInterest:0});save();R()}
function V_debt(){const r=sim(strat);return `<div class="c"><h2>借入一覧</h2>${debtCards(r)}<button class="s" onclick="newDebt()">＋ 借入先を追加</button><div class="row">家族: <input type="number" data-k="family.bal" value="${S.family.bal}"> 手元資金<input type="number" data-k="cash" value="${S.cash}"> 緊急貯金<input type="number" data-k="emerg" value="${S.emerg}"></div></div>
${famCard()}<div class="c formmain"><h2>返済実績の登録</h2><div class="row"><select id="rd">${S.debts.filter(d=>d.bal>0).map(d=>`<option value="${d.id}">${E(d.name)}</option>`).join("")}</select><input type="number" id="ra" placeholder="支払総額"><input type="number" id="ri" placeholder="うち利息(空欄=自動)" style="width:130px"><button onclick="repay()">実績登録</button></div><div class="m">実績登録で初めて残高と手元資金が減ります。完済後の最低返済額は自動で0円扱い。利息は年利÷365×その月の日数の日割りで試算します。利息計算開始日を入れると、完済必要額を概算します。</div></div>
${interestPanel()}${whatIf(r)}<div class="c"><h2>シミュレーション(${ST[strat]})</h2>総支払利息 ${F(r.int)} / 完済 ${r.end}<div class="m">${r.short.length?'<span class="w">資金不足月: '+r.short.join(", ")+"</span>":"資金不足なし"}</div>${chart(r.hist)}</div>`}
function addPlanMonth(){const m=$("#newmonth").value;if(m&&!S.plan[m]){S.plan[m]={sal:0,parent:0,other:0,card:0,emg:0,fam:0};save();R()}}
function V_set(){const c=S.cfg,ms=Object.keys(S.plan).sort(),f=[["living","生活費(保険料含む)"],["free","自由費"],["fam","家族返済/月"],["emgTarget","緊急貯金目標"],["reserve","常時確保する手元資金"],["salTarget","年間給与目標"],["gamble","ギャンブル月上限"]];
return`<div class="c"><h2>基本設定</h2>${f.map(([k,l])=>`<div class="row"><span style="width:170px">${l}</span><input type="number" data-k="cfg.${k}" value="${c[k]??(k=="gamble"?20000:"")}"></div>`).join("")}<div class="row"><span style="width:170px">ギャンブル枠を資金計画に含める</span><select data-k="cfg.gambleInPlan"><option value="">含めない</option><option value="1" ${S.cfg.gambleInPlan?"selected":""}>含める</option></select></div><div class="row"><span style="width:170px">月間総予算</span><input type="number" data-k="bud.total" value="${S.bud.total}"></div>${Object.keys(PM).filter(k=>k!="paypaycr").map(k=>`<div class="row"><span style="width:170px">${PM[k]} 月予算 / 確定支出残</span><input type="number" style="width:80px" data-k="bud.${k}" value="${S.bud[k]}"><input type="number" style="width:80px" data-k="bud.fixed.${k}" value="${S.bud.fixed[k]}"></div>`).join("")}</div>
<div class="c"><h2>月別計画(編集可)</h2><div class="row"><input type="month" id="newmonth" value="${ym(today())}"><button class="s" onclick="addPlanMonth()">＋ 月を追加</button></div><div class="sc"><table><tr><th>月</th><th>給与</th><th>親</th><th>その他</th><th>カード</th><th>緊急</th><th>家族</th></tr>${ms.map(m=>`<tr><td>${m}</td>${["sal","parent","other","card","emg","fam"].map(k=>`<td><input type="number" style="width:78px" data-k="plan.${m}.${k}" value="${S.plan[m][k]||0}"></td>`).join("")}</tr>`).join("")}</table></div></div>
<div class="c"><h2>バックアップ</h2><div class="row"><button class="s" onclick="if(confirm('すべての家計・借金データをこの端末から消去します。復元できません。実行しますか？')){S=blank();save();R()}">この端末の記録を初期化</button></div><div class="row"><button onclick="bk()">JSON保存</button><button class="s" onclick="csvOut()">CSV保存(家計簿・収入)</button><input type="file" accept=".json" onchange="rs(this)"></div><div class="m">${msg}</div><h3>変更履歴</h3>${S.log.slice(0,15).map(l=>`<div class="m">${l.t} ${E(l.a)}</div>`).join("")}</div>`}
/* ---- 操作 ---- */
function addInc(){const a=N($("#ia").value);if(a<=0){alert("入金額を入力してください");return}const x={id:uid(),date:$("#id").value,amt:a,type:$("#it").value,job:$("#ij").value,acct:$("#ic").value,lim:$("#iu").value,actual:$("#ik").value=="1"};S.inc.push(x);if(x.actual)adj(a,x.acct);sel=S.inc.length-1;logA("収入登録 "+x.type+" "+a);save();R()}
function delInc(n){if(!confirm("この収入記録を削除しますか？"))return;const x=S.inc[n];if(x.actual)adj(-N(x.amt),x.acct);S.inc.splice(n,1);sel=0;logA("収入削除");save();R()}
function editTxF(id,f,v){const x=S.tx.find(t=>t.id==id);if(!x)return;if(f=="amt"){v=N(v);if(!v)return;pAdj(x.pm,-(v-N(x.amt)))}else if(f=="pm"){pAdj(x.pm,N(x.amt));pAdj(v,-N(x.amt))}else if(!v)return;logA("支出編集 "+f+" "+x[f]+"→"+v);x[f]=v;save();R()}
function editTx(id,v){const x=S.tx.find(t=>t.id==id);v=N(v);if(!x||!v)return;pAdj(x.pm,-(v-N(x.amt)));logA("支出編集 "+x.amt+"→"+v);x.amt=v;save();R()}
function V_acct(){if(!S.accts.length)return`<div class="c"><h2>口座管理</h2>候補口座(三菱UFJ・イオン・PayPay銀行・みんなの銀行・ゆうちょ・現金・PayPay残高)を作成します。現在の手元資金${F(S.cash)}は「未割当」口座に入り、振替で各口座へ移せます。<div class="row"><button onclick="accInit()">口座管理を開始</button></div></div>`;
const o=S.accts.map(a=>`<tr><td><input data-k="accts.${S.accts.indexOf(a)}.name" value="${E(a.name)}" style="width:120px"></td><td><input data-k="accts.${S.accts.indexOf(a)}.purpose" value="${E(a.purpose||"")}" style="width:90px"></td><td><input type="number" data-k="accts.${S.accts.indexOf(a)}.bal" value="${a.bal}" style="width:84px"></td><td><input type="number" data-k="accts.${S.accts.indexOf(a)}.target" value="${a.target||0}" style="width:84px"></td><td><select data-k="accts.${S.accts.indexOf(a)}.emg"><option value="">通常</option><option value="1" ${a.emg?"selected":""}>緊急貯金</option></select></td><td>${a.target?Math.round(N(a.bal)/a.target*100)+"%":""}</td></tr>`).join("");
const opt=S.accts.map(a=>`<option value="${a.id}">${E(a.name)}</option>`).join("");
return`<div class="c"><h2>口座</h2><div class="sc"><table><tr><th>名前</th><th>用途</th><th>残高</th><th>目標</th><th>区分</th><th>達成</th></tr>${o}</table></div><div class="m">手元資金 ${F(S.cash)} / 緊急貯金 ${F(S.emerg)}(口座残高の合計から自動計算)</div><div class="row"><input id="an" placeholder="口座名"><button class="s" onclick="S.accts.push({id:uid(),name:$('#an').value||'新口座',bal:0});save();R()">追加</button></div></div>
<div class="c"><h2>口座間の振替</h2><div class="row"><select id="xf">${opt}</select>→<select id="xt">${opt}</select><input type="number" id="xa" placeholder="金額"><button onclick="xfer()">振替</button></div><div class="m">振替は収入・支出に計上されません。緊急貯金口座からの振替は警告します。</div></div>`}
function accInit(){const L=[["未割当(手元資金)","振替前の残高",S.cash],["三菱UFJ銀行","給与受取"],["イオン銀行","生活費"],["PayPay銀行","自由費"],["みんなの銀行","緊急貯金",0,1],["ゆうちょ銀行","返済資金"],["現金","現金"],["PayPay残高","PayPay"]];S.accts=L.map(([n,p,b,e])=>({id:uid(),name:n,purpose:p,bal:b||0,emg:e?"1":""}));if(S.emerg>0)S.accts[4].bal=S.emerg;logA("口座管理開始");sync();save();R()}
function xfer(){const f=S.accts.find(a=>a.id==$("#xf").value),t=S.accts.find(a=>a.id==$("#xt").value),a=N($("#xa").value);if(!f||!t||f==t||a<=0)return;if(a>N(f.bal)){alert("振替元の残高が不足しています");return}if(f.emg&&!confirm("緊急貯金口座から取り崩します。よろしいですか?"))return;f.bal-=a;t.bal=N(t.bal)+a;sync();logA("振替 "+f.name+"→"+t.name+" "+a);save();R()}
function addTx(){const a=N($("#ta").value);if(a<=0){alert("支出額を入力してください");return}const p=paymentValue($("#tp").value);if(!p){alert("使ったカードまたは支払い方法を選択してください");return}if($("#tc").value=="ギャンブル"&&gUsed()+a>gcap()&&!confirm("月の上限("+F(gcap())+")を超えます。登録しますか?"))return;S.tx.push({id:uid(),date:$("#td").value,amt:a,cat:$("#tc").value,pm:p.pm,card:p.card,memo:$("#tm").value});pAdj(p.pm,-a);logA("支出 "+a);save();R()}
function delTx(id){if(!confirm("この支出記録を削除しますか？"))return;const x=S.tx.find(t=>t.id==id);if(x)pAdj(x.pm,N(x.amt));S.tx=S.tx.filter(t=>t.id!=id);logA("支出削除");save();R()}
function approve(){const i=S.inc[sel];if(!i||!i.actual||S.plans.some(p=>p.inc===i.id)){alert("登録済みまたは未入金です");return}const a=alloc(N(i.amt),strat);S.plans.push({id:uid(),inc:i.id,items:a.items.map(x=>({...x,done:false}))});logA("配分承認 "+ST[strat]);save();R()}
function doneItem(p,x){const it=S.plans[p].items[x];if(it.done)return;if(it.type=="rep"){const d=S.debts.find(d=>d.id==it.debtId);if(!d)return;const v=prompt("実際の支払額に含まれる利息(円)を入力",accrued(d)??"");if(v===null||v.trim()===""||!Number.isFinite(Number(v)))return;if(!recordPayment(d,it.amt,Number(v)))return}else if(it.type=="emg"){if(it.amt>S.cash){alert("手元資金不足");return}adj(-it.amt);adj(it.amt,null,true)}it.done=true;logA("実績登録 "+it.label+" "+it.amt);save();R()}

function recordPayment(d,a,ie){if(!d||a<=0||a>S.cash||ie<0||ie>a||a-ie>d.bal){alert("支払額・利息・手元資金を確認してください");return false}const accruedNow=accrued(d);d.bal=Math.max(0,d.bal-(a-ie));d.paidInterest=N(d.paidInterest)+ie;d.carryInterest=Math.max(0,(accruedNow??ie)-ie);d.lastDate=today();adj(-a);logA("返済実績 "+d.name+" 支払"+a+"(元金"+(a-ie)+"/利息"+ie+")");return true}
function repay(){const d=S.debts.find(d=>d.id==$("#rd").value),a=N($("#ra").value);if(!d||!a)return;const ie=$("#ri").value===""?accrued(d):N($("#ri").value);if(ie==null){alert("利息計算開始日または実際の利息を入力してください");return}if(recordPayment(d,a,ie)){save();R()}}

function mv(i,d){const j=i+d;if(j<0||j>=S.debts.length)return;[S.debts[i],S.debts[j]]=[S.debts[j],S.debts[i]];save();R()}
function browserSave(name,data){const u=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function bk(){try{browserSave("finance-planner-backup.json",JSON.stringify(S));S.lastBk=new Date().toISOString();save()}catch(e){msg="バックアップ保存に失敗しました"}R()}
function rs(el){const f=el.files&&el.files[0];if(!f)return;if(!confirm("現在のデータをバックアップの内容で置き換えます。よろしいですか？"))return;f.text().then(t=>{const d=JSON.parse(t);if(!d||typeof d!=="object"||!Array.isArray(d.debts))throw Error("バックアップ形式が違います");load(t);logA("バックアップを復元");save();R()}).catch(e=>{alert("復元できませんでした: "+e.message)})}
document.addEventListener("change",e=>{const k=e.target.dataset?.k;if(!k)return;const p=k.split("."),v=e.target.type=="number"?(e.target.value===""?null:N(e.target.value)):e.target.value;let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];if(e.target.type==="number"&&v!==null&&v<0){alert("0以上の数値を入力してください");R();return}o[p[p.length-1]]=v;sync();logA("編集 "+k);save();const open=[...document.querySelectorAll(".debtcard details")].map(d=>d.open);R();document.querySelectorAll(".debtcard details").forEach((d,i)=>d.open=!!open[i])});
function R(){const icons={home:"⌂",inc:"＋",tx:"¥",cal:"▦",acct:"▤",debt:"↘",set:"⚙"};$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?"on":""}" aria-current="${k==tab?"page":"false"}" onclick="go(\'${k}\')"><span class="ni" aria-hidden="true">${icons[k]}</span>${l}</button>`).join("");const V={home:V_home,inc:V_inc,tx:V_tx,cal:V_cal,acct:V_acct,debt:V_debt,set:V_set}[tab];$("#app").innerHTML=`<header class="pagehead"><h1>${TABS.find(t=>t[0]===tab)[1]}</h1><small>${today().replaceAll("-","/")} · v2.3</small></header>`+(!S.debts.length&&tab==="home"?`<div class="c"><b>最初の設定</b><p class="m">JSONから復元するか、借入先と予算を登録してください。</p><button onclick="go(\'set\')">データを復元・設定</button> <button class="s" onclick="go(\'debt\')">借入先を登録</button></div>`:"")+V()}
(()=>{let raw="{}";try{raw=localStorage.getItem("dp")||"{}"}catch(e){}load(raw);R();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{})})();
setInterval(()=>{if(S)R()},3600000);
</script></body></html>
